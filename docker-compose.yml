version: '3.8'

services:
  instaboard:
    build: .
    container_name: instaboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database across container restarts
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=https://insta.asonato.com
